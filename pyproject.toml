[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chrooked-pokedex"
version = "0.1.0"
description = "Engine-neutral Pokémon Ruleset with per-engine appliers (pokeemerald, Essentials)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
chrooked-pokedex = "chrooked_pokedex.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
