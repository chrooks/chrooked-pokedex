[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chrooked-pokedex"
version = "0.1.0"
description = "Engine-neutral Pokémon Ruleset with per-engine appliers (pokeemerald, Essentials)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Lore lookup (#75) fetches PokeAPI + Bulbapedia so the suggesters read
    # real sources instead of the model's recall. Also used by the FastAPI
    # TestClient, so it must be present wherever the web app is.
    "httpx>=0.27",
    # Provider-agnostic LLM client behind the LlmProvider Port (D-D): one
    # interface over Claude/OpenAI/Bedrock/Ollama/HF, model selected by config.
    "litellm>=1.40",
    # Load provider keys/config from a repo-root `.env` (bring-your-own-key DX).
    "python-dotenv>=1.0",
    # Crop Rejuv 2x2 battler sheets to the front-normal quadrant server-side.
    "pillow>=10",
]

[project.scripts]
chrooked-pokedex = "chrooked_pokedex.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: a fast, hermetic unit test",
    "integration: exercises a real on-disk base/fork checkout; skipped when absent",
]
