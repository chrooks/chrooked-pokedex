description: The Pokémon's body is in a fluid, liquid state, causing physical blows to squish harmlessly through it — all damage from contact moves is halved. However, the bearer's liquid composition makes it especially vulnerable to Water-type moves, which are treated as super effective regardless of the bearer's typing (this effect stacks multiplicatively with existing type chart interactions).
