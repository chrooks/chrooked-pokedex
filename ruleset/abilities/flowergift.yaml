name: Flower Gift
chrooked_id: flowergift
aka: {  }
description: Cherrim's signature bloom ability. In harsh sunlight, Cherrim shifts from its Overcast Form into its radiant Sunshine Form (Fire/Fairy); outside of harsh sunlight it reverts to Overcast Form (Grass). Regardless of form, this Pokémon treats Fire-type and Grass-type moves as if they share its type, granting a flat 1.5× bonus to those moves — this ability-granted bonus does not stack with any natural STAB the user may already have from its own typing. Additionally, Morning Sun always restores 75% of maximum HP no matter the weather condition.
