name: Coil Up
chrooked_id: coilup
aka: {  }
description: "When this Pokémon enters the field it coils its body in preparation, loading a single strike. The very next biting move it uses is granted +1 priority — it lunges before opponents can react. Once that coiled strike is spent the charge is gone until the Pokémon switches out and returns, at which point the coil is reset. Flavor: a serpent slowly winding itself tight before snapping forward with terrifying speed."
