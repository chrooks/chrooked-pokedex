description: The Pokémon's body is a running program rather than matter, so physical blows pass straight through it — damage from contact moves is reduced to one third. However, its wholly digital composition leaves it open to intrusion, and Dark-type moves are treated as super effective regardless of the bearer's typing (this effect stacks multiplicatively with existing type chart interactions).
