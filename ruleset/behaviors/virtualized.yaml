# Behavior spec — human-owned. The seed never touches this folder.
# Shape mirrors Liquified: one contact-damage clause + one type-vulnerability clause
# that ignores the bearer's actual typing.
name: Virtualized
chrooked_id: virtualized
applies_to: ability
aka: {  }
effects:
  - summary: Reduce damage from contact moves to one third
    trigger: damage-calc
    when: The incoming move makes contact (as defined by the contact flag)
    effect: Multiply the final damage dealt to the bearer by 1/3 (0.333...). This applies after all other damage modifiers (type chart, stat stages, held items, etc.).
  - summary: Dark-type moves are super effective against the bearer
    trigger: damage-calc
    when: The incoming move is Dark-type
    effect: "Apply an additional ×2 multiplier to the damage dealt to the bearer, stacking multiplicatively with the standard type-effectiveness chart. This represents the digital body being intruded upon rather than struck. (Example: a Dark move that would normally be neutral deals ×2; one that would normally be ×2 deals ×4.)"
test_cases:
  - given: A Porygon2 with Virtualized is hit by Close Combat (contact, Fighting-type, normally neutral)
    expect: Porygon2 takes 1/3 the normal damage (contact reduction applies; no Dark interaction)
  - given: A Porygon-Z with Virtualized is hit by Dark Pulse (non-contact, Dark-type, normally ×2 vs Normal/Ghost)
    expect: Porygon-Z takes ×4 damage (the ability's ×2 stacks on the chart's ×2; no contact, so no reduction)
  - given: A Porygon-Z with Virtualized is hit by Crunch (contact AND Dark-type, normally ×2 vs Normal/Ghost)
    expect: "Porygon-Z takes ×4 × 1/3 ≈ ×1.33 damage — the contact reduction and the Dark modifiers combine multiplicatively"
  - given: A Porygon with Virtualized is hit by Earthquake (non-contact physical, normally neutral)
    expect: Porygon takes normal damage — non-contact physical moves are NOT reduced
notes:
  - The contact reduction applies only to moves that physically make contact; non-contact physical moves (e.g., Earthquake, Rock Slide) are NOT reduced. That is the intended counterplay alongside Dark.
  - The Dark super-effectiveness multiplier is independent of the bearer's actual typing. A Dark-resistant or Dark-immune bearer still takes the ×2 modifier from this ability.
  - Deliberately stronger than Liquified's ×0.5 contact clause (this is ×1/3). The counterweight is Dark, which on the intended user (Porygon-Z, Normal/Ghost) is already the line's sole weakness and lands at ×4.
  - Ability-suppressing mechanics (Mold Breaker, Neutralizing Gas, etc.) remove both effects simultaneously.
  - This ability does NOT change the bearer's actual type chart for immunity purposes (e.g., a Dark-immune bearer via another effect would resolve that immunity before this ability's modifier).
  - STUB — engine_hints ungrounded, needs human grounding pass before an Applier can compile it.
