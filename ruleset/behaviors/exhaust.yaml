# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Exhaust
chrooked_id: exhaust
applies_to: ability
aka: { pokeemerald: ABILITY_EXHAUST }
effects:
  - summary: "Contact moves have a 30% chance to lower the target's accuracy by one stage."
    trigger: stat-change
    when: "this Pokemon damages a target with a contact move, the target survives, its accuracy is above -6, and a 30% roll succeeds"
    effect: "30% chance to lower the target's accuracy by 1 stage"
test_cases:
  - given: "an Exhaust Pokemon uses a contact move (e.g. Tackle), the target survives, and the 30% roll succeeds"
    expect: "the target's accuracy drops one stage"
  - given: "an Exhaust Pokemon uses a contact move but the 30% roll fails"
    expect: "the target's accuracy is unchanged"
  - given: "an Exhaust Pokemon uses a non-contact move (e.g. Water Gun)"
    expect: "the target's accuracy is unchanged (no contact = no trigger, no roll)"
  - given: "the target's accuracy is already at -6"
    expect: "the trigger does not fire (gated on accuracy above MIN_STAT_STAGE)"
notes:
  - "30% chance per damaging contact hit — a RandomPercentage roll, like the other on-contact effects in this set (cf. Poison Touch's 30%). Rolls only after the contact + damage + accuracy-above-(-6) gates pass."
  - "Suppressed when the attacker holds Protective Pads, when the hit is confusion self-damage, or when the target took no damage."
  - "stat-change is the closest neutral trigger; the real shape is 'on a damaging contact hit, 30% chance to apply a -1 accuracy stat change to the target'."
engine_hints:
  pokeemerald: "src/battle_util.c ABILITYEFFECT_MOVE_END_ATTACKER, case ABILITY_EXHAUST (line ~6424). Gates: !MOVE_RESULT_NO_EFFECT, IsBattlerAlive(target), !confusionSelfDmg, IsMoveMakingContact, IsBattlerTurnDamaged, holdEffect != PROTECTIVE_PADS, CompareStat(target, STAT_ACC, MIN_STAT_STAGE, CMP_GREATER_THAN), then RandomPercentage(30). Applies gBattleScripting.moveEffect = MOVE_EFFECT_ACC_MINUS_1."
  essentials: "In the on-dealing-contact hook, on a damaging contact hit with the target above -6, roll 30% (pbRandom(100) < 30) and on success apply a -1 ACCURACY stat stage to the target."
