# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Tectonize
chrooked_id: tectonize
applies_to: ability
aka: { pokeemerald: ABILITY_TECTONIZE }
effects:
  - summary: "Normal-type moves become Ground-type and gain +20% power."
    trigger: damage-calc
    when: "the move's type is Normal (and not Dynamaxed/Z-Move; excludes Weather Ball, Natural Gift, Change-Type-on-Item, Revelation Dance, Terrain Pulse, Struggle)"
    effect: "convert the move's type from Normal to Ground, then multiply its power by 1.2"
test_cases:
  - given: "Tectonize user uses Tackle (Normal) at an Electric-type foe"
    expect: "Tackle deals damage as a Ground-type move (super effective vs Electric) with 1.2x power"
  - given: "Tectonize user uses Tackle vs a Flying-type foe"
    expect: "the move has no effect (Ground does not hit Flying), confirming the type changed from Normal"
  - given: "Tectonize user uses Earthquake (already Ground) or Ember (Fire)"
    expect: "no conversion and no +20% boost — only Normal-type moves are affected"
notes:
  - "The +20% is flat 1.2x in this fork — not the gen-dependent 1.3/1.2 of stock -ate abilities."
  - "Converting Normal to Ground makes the move unable to hit Flying types (and Levitate / Air Balloon holders)."
engine_hints:
  pokeemerald: "type set in TrySetAteType -> TYPE_GROUND (src/battle_main.c:5878); +20% in battle_util.c type-modifier switch, case ABILITY_TECTONIZE, UQ_4_12(1.2) gated on moveType==TYPE_GROUND && ateBoost (src/battle_util.c:6912). Conversion gated by GetDynamicMoveType at battle_main.c:6132."
  essentials: "Battle::Move type/damage calc — when user ability is Tectonize and move is Normal, set type to :GROUND and apply a 1.2x base-power multiplier"
