# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Martial Artist
chrooked_id: martialartist
applies_to: ability
aka: { pokeemerald: ABILITY_MARTIAL_ARTIST }
effects:
  - summary: "Punching moves and kicking moves deal 30% more damage."
    trigger: damage-calc
    when: "this Pokemon uses a move flagged as a punching move OR a kicking move"
    effect: "multiply the move's damage by 1.3"
test_cases:
  - given: "Martial Artist user uses Mach Punch (a punching move)"
    expect: "damage is multiplied by 1.3"
  - given: "Martial Artist user uses High Jump Kick (a kicking move)"
    expect: "damage is multiplied by 1.3"
  - given: "Martial Artist user uses Tackle (neither punch nor kick)"
    expect: "no boost; normal damage applies"
notes:
  - "Keys off two per-move flags: punchingMove (engine-standard) and kickingMove (custom). A move that is both still gets a single 1.3x."
engine_hints:
  pokeemerald: "src/battle_util.c attacker-ability damage modifier switch (~line 6969): case ABILITY_MARTIAL_ARTIST gates on (IsPunchingMove(move) || IsKickingMove(move)) → UQ_4_12(1.3). Flags = gMovesInfo[].punchingMove and .kickingMove (include/move.h:106,136)."
  essentials: "Battle::Move damage-calc hook — if user ability is Martial Artist and move has the punch or kick flag, apply a 1.3x multiplier."
