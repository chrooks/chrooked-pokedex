# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Deadlock
chrooked_id: deadlock
aka: {  }
applies_to: ability
effects:
  - summary: "On entry, each opposing Pokemon loses one stage of Speed."
    trigger: switch-in
    when: "this Pokemon enters the field"
    effect: "lower each opposing Pokemon's Speed by one stage, once per entry — the Intimidate cadence, Speed in place of Attack"
  - summary: "While this Pokemon is on the field, opponents cannot switch out or flee."
    trigger: escape-check
    when: "an opposing Pokemon tries to switch out or flee while this Pokemon is on the field"
    effect: "block the switch, the way Arena Trap does — the trap is tied to this Pokemon being present, not to a move having landed, so it lifts the moment this Pokemon leaves"
  - summary: "Ghost-types ignore the trap."
    trigger: escape-check
    when: "the opposing Pokemon that tries to leave is a Ghost-type"
    effect: "allow the switch — Ghost-types ignore every trapping effect, and Deadlock is no exception"
test_cases:
  - given: "a Deadlock user switches in against an opponent"
    expect: "the opponent's Speed falls one stage, and the message reads once per entry, not every turn"
  - given: "a Deadlock user is on the field and the opponent tries to switch"
    expect: "the switch is blocked"
  - given: "the Deadlock user faints or switches out, then the opponent tries to switch"
    expect: "the switch goes through — the trap ended with the holder's presence"
  - given: "a Ghost-type opponent tries to switch out against a Deadlock user"
    expect: "the switch goes through"
  - given: "an opponent holding a Shed Shell tries to switch out"
    expect: "the switch goes through"
  - given: "a Deadlock user switches in against a Clear Body / White Smoke opponent"
    expect: "no Speed drop, and the trap still applies — the two halves are independent"
  - given: "a Deadlock user switches in twice in one battle"
    expect: "the Speed drop fires on each entry, once each — it is an entry trigger, not a one-per-battle trigger"
notes:
  - "Replaces Penetrating Eyes (`ojospetreos`), which was harvested by accident from a fork where it was a gorgon's signature. Deadlock keeps the mechanic and drops the anatomy: the name has to fit any predator that pins prey before eating it — an ice mask, a carnivorous plant, a spider, a gorgon."
  - "Ecological read: the trap is the hunt and the Speed drop is the prey losing its footing. A holder should be something that FEEDS on what it catches, not a generic wall — pair it with a finisher, not with stall."
  - "The Speed drop follows Intimidate exactly: blocked by Clear Body / White Smoke / Full Metal Body / Mist / substitute, reflected by Mirror Armor if the engine has it. The trap is unaffected by those — a blocked stat drop does not release the prey."
  - "The trap follows Arena Trap: it holds only while the holder is on the field, Ghost-types ignore it, and Shed Shell escapes it. Unlike Arena Trap it does NOT exempt Flying-types or Levitate — Deadlock pins by predation, not by controlling the ground."
  - "Balance note: trapping plus a Speed drop is a strong pairing (Arena Trap is competitively banned). Deliberate for a single-player hack, but keep the holders few and keep their stat lines honest."
engine_hints:
  rejuv: "Two halves, two seams. Speed drop: CHROOKED_SWITCH_IN[:DEADLOCK] — the registry already exists in chrooked_00_core.rb; mirror how an Intimidate-shaped handler lowers a stat on each opposing battler. Trap: there is NO trapping registry in the core yet. Either add one (the core is generated by chrooked-pokedex — extend the generator, do not hand-edit the file), or ship a bespoke chrooked_deadlock.rb that prepends the Essentials switch-out check (pbCanSwitchOut? / pbCanSwitchLax? in Battler.rb, where :SHADOWTAG / :ARENATRAP / :MAGNETPULL are tested) and adds :DEADLOCK alongside them. A bespoke prepend MUST guard with defined?() or the stub tests raise NameError."
  essentials: "Speed drop: an on-switch-in handler that calls pbLowerStatStage(:SPEED, 1, battler) on each opponent, gated by the standard stat-drop immunities. Trap: add the ability to the trapping branch of pbCanSwitchOut?, exempting Ghost-types and Shed Shell holders."
  pokeemerald: "src/battle_util.c. Speed drop: ABILITYEFFECT_ON_SWITCHIN, modelled on ABILITY_INTIMIDATE but targeting STAT_SPEED. Trap: extend the trapping check in CanBattlerEscape / IsBattlerTrapped alongside ABILITY_ARENA_TRAP and ABILITY_SHADOW_TAG, with the Ghost-type and Shed Shell exemptions."
