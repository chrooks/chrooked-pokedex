# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Pyre
chrooked_id: pyre
applies_to: ability
aka: { pokeemerald: ABILITY_PYRE }
effects:
  - summary: "This Pokemon's Ghost-type moves gain a 30% chance to burn the target."
    trigger: status-apply
    when: "this Pokemon uses a damaging Ghost-type move that damages a target which can be burned"
    effect: "with 30% probability, apply the burn status to the target"
test_cases:
  - given: "a Pyre user lands a damaging Ghost-type move on a burnable target many times"
    expect: "the target is burned about 30% of the time"
  - given: "a Pyre user uses a Fire-type (or any non-Ghost) move"
    expect: "no added burn chance (only Ghost moves carry it)"
  - given: "a Pyre user lands a Ghost move on a Fire-type"
    expect: "the burn cannot land (Fire-types are burn-immune)"
notes:
  - "Burn chance is 30%, rolled after the Ghost move connects."
  - "Respects normal immunities: the target must be burnable (not Fire-type, not already statused) and must actually be damaged by the hit; does not fire on confusion self-damage."
  - "Redefined 2026-06-30 — previously a KO-triggered 3-turn Fire/Ghost 1.3x damage window; that mechanic is fully removed."
engine_hints:
  pokeemerald: "src/battle_util.c after-hit handler (ABILITYEFFECT_MOVE_END_ATTACKER, model on Infernal Maw's burn): gate on moveType == TYPE_GHOST && CanBeBurned(target) && IsBattlerTurnDamaged(target) && RandomPercentage(RNG_PYRE, 30), then set MOVE_EFFECT_BURN. Remove the old pyreTimer field + set/boost/decrement sites."
  essentials: "After-hit hook: if the user has Pyre and the move resolved as Ghost-type and the target was damaged, roll 30% to burn the target when it can be burned."
