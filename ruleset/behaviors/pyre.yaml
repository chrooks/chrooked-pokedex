# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Pyre
chrooked_id: pyre
applies_to: ability
aka: { pokeemerald: ABILITY_PYRE }
effects:
  - summary: "Knocking out a target fuels this Pokemon's Fire and Ghost moves for 3 turns."
    trigger: faint
    when: "this Pokemon's move just knocked out the target and battlers remain on both sides"
    effect: "set a 3-turn timer during which this Pokemon's Fire-type and Ghost-type moves are boosted"
  - summary: "While the timer is active, Fire and Ghost moves deal 30% more damage."
    trigger: damage-calc
    when: "the Pyre timer is greater than 0 and the move being used is Fire-type or Ghost-type"
    effect: "multiply the damage modifier by 1.3 (UQ_4_12(1.3))"
test_cases:
  - given: "a Pyre user lands a KO, then on a later turn uses a Fire-type move within 3 turns"
    expect: "that Fire move deals 1.3x boosted damage"
  - given: "a Pyre user lands a KO, then uses a Ghost-type move while the timer is active"
    expect: "that Ghost move deals 1.3x boosted damage"
  - given: "a Pyre user with the timer active uses a Water-type move"
    expect: "no boost applies (only Fire and Ghost are fueled)"
notes:
  - "Timer is set to 3 on KO and decrements by 1 each turn end (only while > 0). The boost applies as long as the timer is > 0 at damage-calc time."
  - "Re-KOing resets the timer back to 3 (the KO handler assigns 3, it does not add)."
engine_hints:
  pokeemerald: "Set: src/battle_script_commands.c VARIOUS_TRY_ACTIVATE_GRIM_NEIGH (line ~10682) — gBattleStruct->pyreTimer[gBattlerAttacker] = 3 on HasAttackerFaintedTarget() && !NoAliveMonsForEitherParty(). Boost: src/battle_util.c attack-modifier switch (line ~9737) — moveType FIRE or GHOST && pyreTimer > 0 → UQ_4_12(1.3). Decrement: src/battle_util.c turn-end ability switch (line ~5566) — pyreTimer-- while > 0. Field: include/battle.h line 756 (u8 pyreTimer[MAX_BATTLERS_COUNT])."
  essentials: "On KO, set a 3-turn counter. In the damage modifier hook, multiply FIRE/GHOST damage by 1.3 while the counter > 0. Decrement the counter each round end."
