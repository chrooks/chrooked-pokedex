# Behavior spec — human-owned. The seed never touches this folder.
# The rain member of the weather-attack family; Whiteout's shape, for rain.
name: Downpour
chrooked_id: downpour
applies_to: ability
aka: {  }
effects:
  - summary: "In rain, boosts the damage of moves that use this Pokemon's higher attacking stat by 50%."
    trigger: damage-calc
    when: "rain is active and affects this Pokemon"
    effect: "if Attack >= Sp. Atk, multiply physical-move damage by 1.5; otherwise multiply special-move damage by 1.5"
test_cases:
  - given: "in rain, a Downpour Pokemon with Attack >= Sp. Atk uses a physical move"
    expect: "the move deals 50% more damage"
  - given: "in rain, a Downpour Pokemon with Sp. Atk > Attack uses a special move"
    expect: "the move deals 50% more damage"
  - given: "in rain, a Downpour Pokemon whose higher stat is Attack uses a special move"
    expect: "no boost (only the move category matching the higher stat is boosted)"
  - given: "a Downpour Pokemon holds a Utility Umbrella in rain"
    expect: "no boost"
notes:
  - "The higher-stat tie (Attack == Sp. Atk) resolves to the physical branch, matching Whiteout."
  - "One of four: Solar Power (sun), Downpour (rain), Duststorm (sand), Whiteout (hail/snow). Same shape, different weather."
  - "Utility Umbrella negates it, as it does every other rain ability. Air Lock / Cloud Nine suppress it. Primordial Sea's heavy rain counts."
  - "Purely offensive — it does not summon rain and has no drawback."
engine_hints:
  pokeemerald: "Attacker-ability damage modifier alongside the Whiteout case in src/battle_util.c — when IsBattlerWeatherAffected(battlerAtk, B_WEATHER_RAIN): if attack >= spAttack boost physical moves x1.5, else boost special moves x1.5 (uq4_12_multiply_half_down)."
  essentials: "Rejuv: patch/Mods/chrooked_downpour.rb (canonical source references/rejuv-harness/) — CHROOKED_DAMAGE_MODS returns 1.5 in :RAINDANCE for the move category matching the user's higher attacking stat, 1.0 while a Utility Umbrella is held."
