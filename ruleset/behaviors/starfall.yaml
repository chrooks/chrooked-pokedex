# Behavior spec — human-owned. The seed never touches this folder.
name: Starfall
chrooked_id: starfall
applies_to: ability
aka: { pokeemerald: ABILITY_STARFALL }
effects:
  - summary: Special moves gain power for each consecutive attacking turn
    trigger: damage-calc
    when: the bearer uses a damaging special move
    effect: Multiply damage by 1 + 0.2 x N, where N is the number of consecutive prior turns (max 3) in which the bearer dealt damage with a move without switching out. Turn 1 is x1.0, turn 2 x1.2, turn 3 x1.4, turn 4 and later x1.6.
  - summary: The streak counts attacking turns
    trigger: turn-end
    when: end of each round while the bearer is on the field
    effect: If the bearer dealt damage with a move this round, N increases by 1 (capped at 3). Otherwise (status move, missed, flinched, asleep) N resets to 0.
  - summary: Switching resets the streak
    trigger: switch-in
    when: the bearer enters the field
    effect: N is set to 0.
test_cases:
  - given: Bearer uses Psybeam on its first turn in
    expect: Normal damage (x1.0).
  - given: Bearer used Psybeam last turn and uses Psybeam again
    expect: x1.2 damage.
  - given: Bearer attacked on each of the last three turns and attacks again
    expect: x1.6 damage; a fifth consecutive attack stays at x1.6.
  - given: Bearer attacked twice, then used Recover, then attacks
    expect: The Recover turn reset the streak; this attack is x1.0.
  - given: Bearer attacked three times, switched out, and came back in
    expect: The first attack after re-entry is x1.0.
  - given: Bearer has a three-turn streak and uses a physical move
    expect: The physical move gets no boost; the streak still counts the turn.
notes:
  - "Design intent: a falling star accelerates. Rewards staying in and firing beams; a Volt Switch pivot is an honest reset."
  - "Reworked 2026-09-04 from the old 30% Sp. Def-drop effect. Users: Gothita line, Staryu line."
engine_hints:
  essentials: >-
    Rejuv: references/rejuv-harness/chrooked_starfall.rb. Streak lives in
    effects[:ChrookedStarfall]; ON_DEAL marks the turn as attacking, TURN_END
    advances or resets the streak, SWITCH_IN zeroes it, DAMAGE_MODS reads it
    for special moves. Check: docker run --rm -v $PWD/references/rejuv-harness:/h:ro ruby:3.2-slim ruby /h/starfall_check.rb
