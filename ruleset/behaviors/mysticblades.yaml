# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Mystic Blades
chrooked_id: mysticblades
applies_to: ability
aka: { pokeemerald: ABILITY_MYSTIC_BLADES }
effects:
  - summary: "Slicing moves deal 30% more damage."
    trigger: damage-calc
    when: "this Pokemon uses a move flagged as a slicing move"
    effect: "multiply the move's damage by 1.3"
  - summary: "Physical slicing moves use the user's Sp. Atk instead of Attack."
    trigger: damage-calc
    when: "this Pokemon uses a physical move flagged as a slicing move"
    effect: "for the attack-stat term, substitute the user's Sp. Atk stat and its Sp. Atk stat stages in place of Attack"
test_cases:
  - given: "Mystic Blades user uses Night Slash (a physical slicing move) with high Sp. Atk and low Attack"
    expect: "damage is computed from Sp. Atk and is multiplied by 1.3"
  - given: "Mystic Blades user uses Tackle (physical, not a slicing move)"
    expect: "no boost and no stat override; damage uses Attack as normal"
  - given: "Mystic Blades user has its Attack lowered but Sp. Atk raised, then uses a slicing move"
    expect: "the Sp. Atk stat stages apply (not the Attack stages)"
notes:
  - "Two distinct mechanics: a 1.3x power boost AND a category-style attack-stat override. They are independent code paths in the fork (boost in the damage modifier switch; stat override in CalcAttackStat)."
  - "The stat override only triggers for moves that are physical AND slicing; it does not change the move's damage class for type effectiveness, only which attack stat is read."
engine_hints:
  pokeemerald: "Boost: src/battle_util.c (~line 7375) case ABILITY_MYSTIC_BLADES gates on IsSlicingMove(move) → UQ_4_12(1.3). Stat override: CalcAttackStat (~line 7189) — when IsBattleMovePhysical(move) && atkAbility==ABILITY_MYSTIC_BLADES && IsSlicingMove(move), atkStat/atkStage are read from spAttack / STAT_SPATK."
  essentials: "Battle::Move damage-calc — if user ability is Mystic Blades and move has the slicing flag: apply 1.3x; and if the move is physical, swap the attack stat read to Special Attack (including its stat stages)."
