# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Hydrate
chrooked_id: hydrate
applies_to: ability
aka: { pokeemerald: ABILITY_HYDRATE }
effects:
  - summary: "Normal-type moves become Water-type and gain +20% power."
    trigger: damage-calc
    when: "the move's type is Normal (and not Dynamaxed/Z-Move; excludes Weather Ball, Natural Gift, Change-Type-on-Item, Revelation Dance, Terrain Pulse, Struggle)"
    effect: "convert the move's type from Normal to Water, then multiply its power by 1.2"
test_cases:
  - given: "Hydrate user uses Tackle (Normal) at a Fire-type foe"
    expect: "Tackle deals damage as a Water-type move (super effective vs Fire) with 1.2x power"
  - given: "Hydrate user uses Tackle vs a Grass-type foe"
    expect: "the move resolves as Water-type (not very effective), confirming the type changed from Normal"
  - given: "Hydrate user uses Surf (already Water) or Vine Whip (Grass)"
    expect: "no conversion and no +20% boost — only Normal-type moves are affected"
notes:
  - "The +20% is flat 1.2x in this fork — not the gen-dependent 1.3/1.2 of stock -ate abilities."
  - "The boost only applies because the conversion fired (ateBoost flag); a move already Water-type gets neither change nor boost."
engine_hints:
  pokeemerald: "type set in TrySetAteType -> TYPE_WATER (src/battle_main.c:5880); +20% in battle_util.c type-modifier switch, case ABILITY_HYDRATE, UQ_4_12(1.2) gated on moveType==TYPE_WATER && ateBoost (src/battle_util.c:6916). Conversion gated by GetDynamicMoveType at battle_main.c:6132."
  essentials: "Battle::Move type/damage calc — when user ability is Hydrate and move is Normal, set type to :WATER and apply a 1.2x base-power multiplier"
