# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Foliate
chrooked_id: foliate
applies_to: ability
aka: { pokeemerald: ABILITY_FOLIATE }
effects:
  - summary: "Normal-type moves become Grass-type and gain +20% power."
    trigger: damage-calc
    when: "the move's type is Normal (and not Dynamaxed/Z-Move; excludes Weather Ball, Natural Gift, Change-Type-on-Item, Revelation Dance, Terrain Pulse, Struggle)"
    effect: "convert the move's type from Normal to Grass, then multiply its power by 1.2"
test_cases:
  - given: "Foliate user uses Tackle (Normal) at a Water-type foe"
    expect: "Tackle deals damage as a Grass-type move (super effective vs Water) with 1.2x power"
  - given: "Foliate user uses Tackle vs a Fire-type foe"
    expect: "the move resolves as Grass-type (not very effective), confirming the type changed from Normal"
  - given: "Foliate user uses Energy Ball (already Grass) or Ember (Fire)"
    expect: "no conversion and no +20% boost — only Normal-type moves are affected"
notes:
  - "The +20% is flat 1.2x in this fork — not the gen-dependent 1.3/1.2 of stock -ate abilities."
  - "The boost only applies because the conversion fired (ateBoost flag); a move already Grass-type gets neither change nor boost."
engine_hints:
  pokeemerald: "type set in TrySetAteType -> TYPE_GRASS (src/battle_main.c:5868); +20% in battle_util.c type-modifier switch, case ABILITY_FOLIATE, UQ_4_12(1.2) gated on moveType==TYPE_GRASS && ateBoost (src/battle_util.c:6900). Conversion gated by GetDynamicMoveType at battle_main.c:6132."
  essentials: "Battle::Move type/damage calc — when user ability is Foliate and move is Normal, set type to :GRASS and apply a 1.2x base-power multiplier"
