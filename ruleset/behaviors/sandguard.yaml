# Behavior spec — human-owned. The seed never touches this folder.
name: Sand Guard
chrooked_id: sandguard
applies_to: ability
aka: {  }
effects:
  - summary: Halves incoming special damage in sandstorm
    trigger: damage-calc
    when: sandstorm is active and the move is special-category
    effect: Multiply the final damage dealt to this Pokémon by 0.5 before it is applied.
  - summary: Immune to end-of-turn sandstorm chip damage
    trigger: turn-end
    when: sandstorm is active
    effect: Skip the 1/16 sandstorm residual damage for this Pokémon.
test_cases:
  - given: Sandstorm is active; foe uses Surf (special) against a Pokémon with Sand Guard
    expect: Damage dealt is halved relative to the standard damage calculation
  - given: Sandstorm is active; foe uses Earthquake (physical) against a Pokémon with Sand Guard
    expect: Damage dealt is NOT halved — Sand Guard only affects special moves
  - given: No weather or non-sandstorm weather is active; foe uses Thunderbolt (special) against a Pokémon with Sand Guard
    expect: Damage dealt is NOT halved — Sand Guard is inactive outside sandstorm
notes:
  - The halving applies to the final damage value (after all other modifiers), functioning identically to Ice Scales in structure but restricted to sandstorm.
  - The sandstorm immunity is a baseline courtesy granted to all sand abilities (Sand Rush, Sand Veil, Sand Force all carry it implicitly); it is included explicitly here to avoid ambiguity.
  - Because the Rock-type Sp. Def boost (+50% Sp. Def in sand for Rock types) already covers the Sp. Def angle for Rock Pokémon natively, Sand Guard should primarily target non-Rock sand dwellers (Ground, Steel, etc.) to avoid stacking into brokenness.
  - Sand Guard does NOT boost any stat, only reduces incoming special damage — preserving a clear mechanical difference from all existing sand abilities.
  - The ability is condition-dependent (requires sandstorm), which is the appropriate limiting factor in lieu of a raw stat boost.
engine_hints:
  pokeemerald: "Defender-ability damage modifier (src/battle_util.c, CalcFinalDmgMods target-ability switch): when IsBattlerWeatherAffected(battlerDef, B_WEATHER_SANDSTORM) and IS_MOVE_SPECIAL(move), multiply by UQ_4_12(0.5) beside the Ice Scales case. Add ABILITY_SANDGUARD to the sandstorm immunity list next to ABILITY_SAND_VEIL/SAND_RUSH/SAND_FORCE in the end-turn weather damage check."
  essentials: "Rejuv: patch/Mods/chrooked_sandguard.rb (canonical source references/rejuv-harness/). CHROOKED_DEFENSE_MODS[:SANDGUARD] returns 0.5 when pbWeather is :SANDSTORM (or the :DESERT/:ASHENBEACH fields) and move.pbIsSpecial?; the AI sees it through the core's pbRoughDamage wrapper. Chip immunity: takesWeatherDamage? (Battle_Effects.rb:1365) keys on a hard ability list and the sand tick subtracts HP directly in pbReduceBattlersHP (Battle.rb:7877), so the core now prepends takesWeatherDamage? and reads CHROOKED_WEATHER_IMMUNE[:SANDGUARD] = [:SANDSTORM]; Desert's Mark still negates it."
