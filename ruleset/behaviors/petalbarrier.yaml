# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Petal Barrier
chrooked_id: petalbarrier
applies_to: ability
aka: { pokeemerald: ABILITY_PETAL_BARRIER }
effects:
  - summary: "On entry the holder is wrapped in fresh petals."
    trigger: switch-in
    when: "this Pokemon enters the field"
    effect: "arm the petal barrier (a per-battler flag)"
  - summary: "While the petals hold, the next damaging hit deals half damage, then the petals scatter."
    trigger: damage-calc
    when: "this Pokemon is the target of a damaging move, the barrier is armed, and it is not behind a Substitute"
    effect: "multiply the incoming damage by 0.5; after the hit lands, clear the flag and announce that the petals scattered"
test_cases:
  - given: "a Petal Barrier Pokemon enters and is hit by Surf"
    expect: "it takes 0.5x damage and the petals scatter"
  - given: "the same Pokemon is hit again without leaving the field"
    expect: "full damage — the barrier is spent"
  - given: "it is hit by a two-hit move such as Double Kick"
    expect: "the first hit is halved, the second is full"
  - given: "it survives a Protect turn or several unhit turns"
    expect: "the petals do NOT regrow; only switching out resets them"
  - given: "it switches out and back in"
    expect: "the barrier is armed again"
notes:
  - "Petals regrow only by leaving the field: the flag drops with the battler's other volatile effects on switch-out, and re-entry re-arms it."
  - "Redesigned 2026-10-08. The old version (0.75x special + Shed Skin cure) had two effects that did not share a story. This is Multiscale without the full-HP gate and without regrowth on the field."
  - "No regrow while on the field, by decision: a per-unhit-turn regrow is farmable with Protect and Substitute."
  - "Physical and special hits both scatter the petals. Status moves do not touch them."
  - "A hit into a Substitute neither gets halved nor scatters the petals."
  - "Mold Breaker ignores the reduction (shared core gate)."
engine_hints:
  pokeemerald: "Switch-in: set a battler flag in gBattleStruct (SwitchInAbilities, src/battle_util.c). Damage: GetDefenderAbilitiesModifier — `case ABILITY_PETAL_BARRIER: if (flag) return UQ_4_12(0.5);`. After the hit: in the target-ability move-end handler (same site as Disguise's bust), clear the flag and print a string. pbInitEffects-equivalent: the flag lives with volatile battler data so it drops on switch-out."
  essentials: "Rejuv: CHROOKED_SWITCH_IN arms battler.effects[:ChrookedPetals]; CHROOKED_DEFENSE_MODS returns 0.5 while armed and no Substitute; CHROOKED_WHEN_HIT clears the flag and shows the ability box. pbInitEffects wipes effects on switch-out, so regrow is switch-only for free."
