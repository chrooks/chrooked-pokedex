# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Updraft
chrooked_id: updraft
applies_to: ability
aka: { pokeemerald: ABILITY_UPDRAFT }
effects:
  - summary: "Wing moves and wind moves deal 30% more damage."
    trigger: damage-calc
    when: "this Pokemon uses a move flagged as a wing move OR a wind move"
    effect: "multiply the move's damage by 1.3"
test_cases:
  - given: "Updraft user uses a wing move (e.g. Brave Bird)"
    expect: "damage is multiplied by 1.3"
  - given: "Updraft user uses a wind move (e.g. Gust / Hurricane)"
    expect: "damage is multiplied by 1.3"
  - given: "Updraft user uses Tackle (neither wing nor wind)"
    expect: "no boost; normal damage applies"
notes:
  - "Two independent flags both qualify: wingMove (custom) and windMove (engine-standard)."
  - "The boost is not stacked when a move is both wing and wind — it is a single 1.3x multiplier."
  - "Deep-swapped with Wingspan 2026-08-19: name, chrooked_id, and engine symbols all moved together, so this record is the boost-only mechanic end to end. Holders were untouched — the boost-only birds already carried the name Updraft."
engine_hints:
  pokeemerald: "The boost-only mechanic now belongs to ABILITY_UPDRAFT, but existing fork C still implements it under ABILITY_WINGSPAN (attacker-ability damage modifier switch, src/battle_util.c ~6961: UQ_4_12(1.3) when IsWingMove(move) || IsWindMove(move)) — the two case bodies must be swapped by hand when a pokeemerald target is next touched. Flags = gMovesInfo[].wingMove (custom, include/move.h:138) and .windMove (engine-standard)."
  essentials: "Rejuv symbols are name-derived, so this mechanic lives on :UPDRAFT — chrooked_updraft.rb registers the 1.3x wing/wind damage modifier under :UPDRAFT."
