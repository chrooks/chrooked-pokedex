# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Mineralize
chrooked_id: mineralize
applies_to: ability
aka: { pokeemerald: ABILITY_MINERALIZE }
effects:
  - summary: "Normal-type moves become Rock-type and gain +20% power."
    trigger: damage-calc
    when: "the move's type is Normal (and not Dynamaxed/Z-Move; excludes Weather Ball, Natural Gift, Change-Type-on-Item, Revelation Dance, Terrain Pulse, Struggle)"
    effect: "convert the move's type from Normal to Rock, then multiply its power by 1.2"
test_cases:
  - given: "Mineralize user uses Tackle (Normal) at a Fire-type foe"
    expect: "Tackle deals damage as a Rock-type move (super effective vs Fire) with 1.2x power"
  - given: "Mineralize user uses Tackle vs a Ground-type foe"
    expect: "the move resolves as Rock-type (not very effective), confirming the type changed from Normal"
  - given: "Mineralize user uses Rock Slide (already Rock) or Water Gun (Water)"
    expect: "no conversion and no +20% boost — only Normal-type moves are affected"
notes:
  - "The +20% is flat 1.2x in this fork — not the gen-dependent 1.3/1.2 of stock -ate abilities."
  - "The boost only applies because the conversion fired (ateBoost flag); a move already Rock-type gets neither change nor boost."
engine_hints:
  pokeemerald: "type set in TrySetAteType -> TYPE_ROCK (src/battle_main.c:5890); +20% in battle_util.c type-modifier switch, case ABILITY_MINERALIZE, UQ_4_12(1.2) gated on moveType==TYPE_ROCK && ateBoost (src/battle_util.c:6928). Conversion gated by GetDynamicMoveType at battle_main.c:6132."
  essentials: "Battle::Move type/damage calc — when user ability is Mineralize and move is Normal, set type to :ROCK and apply a 1.2x base-power multiplier"
