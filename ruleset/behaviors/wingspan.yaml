# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Updraft
chrooked_id: wingspan
applies_to: ability
aka: { pokeemerald: ABILITY_WINGSPAN }
effects:
  - summary: "Wing moves and wind moves deal 30% more damage."
    trigger: damage-calc
    when: "this Pokemon uses a move flagged as a wing move OR a wind move"
    effect: "multiply the move's damage by 1.3"
test_cases:
  - given: "Updraft user uses a wing move (e.g. Brave Bird)"
    expect: "damage is multiplied by 1.3"
  - given: "Updraft user uses a wind move (e.g. Gust / Hurricane)"
    expect: "damage is multiplied by 1.3"
  - given: "Updraft user uses Tackle (neither wing nor wind)"
    expect: "no boost; normal damage applies"
notes:
  - "Two independent flags both qualify: wingMove (custom) and windMove (engine-standard)."
  - "The boost is not stacked when a move is both wing and wind — it is a single 1.3x multiplier."
  - "Renamed 2026-08-19: this mechanic was displayed as 'Wingspan' and now displays as 'Updraft'. chrooked_id and the pokeemerald symbol stay ABILITY_WINGSPAN; name-derived Rejuv symbols follow the new name (:UPDRAFT)."
engine_hints:
  pokeemerald: "src/battle_util.c attacker-ability damage modifier switch (~line 6961): case ABILITY_WINGSPAN gates on (IsWingMove(move) || IsWindMove(move)) → UQ_4_12(1.3). Flags = gMovesInfo[].wingMove (custom, include/move.h:138) and .windMove (engine-standard). Symbol unchanged; only the display-name string in the fork's ability data needs the rename."
  essentials: "Rejuv symbol is name-derived, so this mechanic now lives on :UPDRAFT — chrooked_wingspan.rb registers the 1.3x wing/wind damage modifier under :UPDRAFT."
