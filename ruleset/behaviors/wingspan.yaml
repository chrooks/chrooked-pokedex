# Behavior spec — human-owned. The seed never touches this folder.
# Grounded in chrooked-patch-source C. Do not guess; the C is cited in engine_hints.
name: Wingspan
chrooked_id: wingspan
applies_to: ability
aka: { pokeemerald: ABILITY_WINGSPAN }
effects:
  - summary: "Immune to Ground moves; takes no damage from them."
    trigger: damage-calc
    when: "an incoming move's type is Ground"
    effect: "the move is blocked and deals no damage (no stat change, like Soundproof)"
  - summary: "Boosts wing and wind moves by 30%."
    trigger: damage-calc
    when: "this Pokemon uses a wing move or a wind move"
    effect: "multiply the move's damage by 1.3"
test_cases:
  - given: "a Wingspan Pokemon is hit by Earthquake (Ground)"
    expect: "it takes 0 damage and no stat changes"
  - given: "a Wingspan Pokemon uses a wind move (e.g. Hurricane / Gust class) "
    expect: "the move deals ~30% more damage"
  - given: "a Wingspan Pokemon uses a non-wing/non-wind move"
    expect: "no damage boost applies"
notes:
  - "Ground immunity is a pure block (no heal, no stat gain) — same script as Soundproof."
  - "The 1.3x boost keys off the engine's IsWingMove / IsWindMove move flags, matching the boost-only twin Updraft."
  - "Deep-swapped with Updraft 2026-08-19: name, chrooked_id, and engine symbols all moved together, so this record is the ground-immunity kit end to end. Holders were untouched — the ground-immune five already carried the name Wingspan."
engine_hints:
  pokeemerald: "The ground-immunity kit now belongs to ABILITY_WINGSPAN, but existing fork C still implements it under ABILITY_UPDRAFT (Ground block in TryAbsorbMove switch via BattleScript_SoundproofProtected, src/battle_util.c:2451; 1.3x wing/wind boost at :6965) — the two case bodies must be swapped by hand when a pokeemerald target is next touched."
  essentials: "Rejuv symbols are name-derived, so this mechanic lives on :WINGSPAN — chrooked_wingspan.rb registers the Ground type-immunity hook (block, no effect) plus the 1.3x wing/wind damage modifier under :WINGSPAN."
