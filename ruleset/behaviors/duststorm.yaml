# Behavior spec — human-owned. The seed never touches this folder.
# The sand member of the weather-attack family; Whiteout's shape, for sandstorm.
name: Duststorm
chrooked_id: duststorm
applies_to: ability
aka: {  }
effects:
  - summary: "In a sandstorm, boosts the damage of moves that use this Pokemon's higher attacking stat by 50%."
    trigger: damage-calc
    when: "a sandstorm is active and affects this Pokemon"
    effect: "if Attack >= Sp. Atk, multiply physical-move damage by 1.5; otherwise multiply special-move damage by 1.5"
test_cases:
  - given: "in a sandstorm, a Duststorm Pokemon with Attack >= Sp. Atk uses a physical move"
    expect: "the move deals 50% more damage"
  - given: "in a sandstorm, a Duststorm Pokemon with Sp. Atk > Attack uses a special move"
    expect: "the move deals 50% more damage"
  - given: "in a sandstorm, a Duststorm Pokemon whose higher stat is Attack uses a special move"
    expect: "no boost (only the move category matching the higher stat is boosted)"
  - given: "a Duststorm Pokemon battles on the Desert field with no sandstorm up"
    expect: "the boost still applies — the field counts as sand, matching Sand Force"
notes:
  - "The higher-stat tie (Attack == Sp. Atk) resolves to the physical branch, matching Whiteout."
  - "One of four: Solar Power (sun), Downpour (rain), Duststorm (sand), Whiteout (hail/snow). Same shape, different weather."
  - "Utility Umbrella does not block sand, so it has no effect here. Air Lock / Cloud Nine still suppress it."
  - "Rejuv's Desert and Ashen Beach fields count as sand for this ability, mirroring Sand Force."
  - "Purely offensive — it does not summon sand and has no drawback."
engine_hints:
  pokeemerald: "Attacker-ability damage modifier alongside the Whiteout case in src/battle_util.c — when IsBattlerWeatherAffected(battlerAtk, B_WEATHER_SANDSTORM): if attack >= spAttack boost physical moves x1.5, else boost special moves x1.5 (uq4_12_multiply_half_down). No field-effect rider on this engine."
  essentials: "Rejuv: patch/Mods/chrooked_duststorm.rb (canonical source references/rejuv-harness/) — CHROOKED_DAMAGE_MODS returns 1.5 in :SANDSTORM, or on the :DESERT / :ASHENBEACH fields, for the move category matching the user's higher attacking stat."
