# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Rimefang
chrooked_id: rimefang
aka: {  }
applies_to: ability
effects:
  - summary: "Biting moves deal 30% more damage."
    trigger: damage-calc
    when: "this Pokemon uses a move flagged as a biting move"
    effect: "multiply the move's damage by 1.3"
  - summary: "Biting moves gain a 30% chance to frostbite the target."
    trigger: status-apply
    when: "this Pokemon's biting move damages a target that can be frostbitten"
    effect: "with 30% probability, apply the frostbite status to the target"
  - summary: "Biting moves gain a flat 30% chance to make the target flinch."
    trigger: status-apply
    when: "this Pokemon's biting move damages a target"
    effect: "with 30% probability, make the target flinch (independent of the move's own flinch rate and of the frostbite roll)"
test_cases:
  - given: "a Rimefang user uses Crunch (a biting move) many times against a frostbitable target"
    expect: "damage is multiplied by 1.3, the target is frostbitten about 30% of the time, and flinches about 30% of the time"
  - given: "a Rimefang user uses Tackle (not a biting move)"
    expect: "no boost, no added frostbite chance, and no added flinch chance"
  - given: "a Rimefang user lands a biting move on an Ice-type"
    expect: "the 1.3x boost applies and the flinch roll still happens, but the frostbite cannot land (Ice-types are frostbite-immune)"
notes:
  - "The Ice-side twin of Infernal Maw: same 1.3x biting boost and same flat 30% flinch, with frostbite where Infernal Maw burns. Keep the two in step — a change to one's numbers is a decision about both."
  - "Frostbite is the Ruleset's reskin of freeze — see the `frostbite` behavior. It halves SPECIAL damage, so Rimefang's rider hurts special attackers the way Infernal Maw's burn hurts physical ones. On a physical wallbreaker target the flinch is the real payload."
  - "The frostbite respects normal immunities: Ice-types and already-statused targets cannot be frostbitten, the target must actually be damaged by the hit, and it does not fire on confusion self-damage."
  - "The flinch is a flat 30% regardless of the move's own flinch rate; it uses the normal flinch helper, so Inner Focus / substitute / already-moved gating still applies."
  - "Biting moves are matched by the dedicated bitingMove flag, the same one Strong Jaw uses."
engine_hints:
  rejuv: "Reuse the frostbite plumbing already added for the `frostbite` behavior — do NOT re-implement the status. Damage: hook the biting 1.3x the way Strong Jaw is applied in Battle_Move.rb's damage calc. After-hit: on a damaging biting move, roll 30% and call the same frostbite application path the Ruleset's freeze-moves use (Rejuv's :FROZEN slot), guarded by the standard can-be-statused checks; then roll an independent flat 30% flinch. A bespoke Module#prepend in chrooked_rimefang.rb must guard with defined?() so the stub tests do not raise NameError."
  pokeemerald: "src/battle_util.c, mirroring ABILITY_INFERNAL_MAW. Power: CalcAttackerAbilitiesModifier — `case ABILITY_RIMEFANG: if (IsBitingMove(move)) modifier *= UQ_4_12(1.3);`. Status + flinch: ABILITYEFFECT_MOVE_END_ATTACKER, gated on IsBitingMove(move) && IsBattlerTurnDamaged(target); roll RandomPercentage(RNG_RIMEFANG, 30) for the frostbite effect and an independent RandomPercentage(RNG_RIMEFANG_FLINCH, 30) -> MOVE_EFFECT_FLINCH."
  essentials: "Damage-calc: if the user has Rimefang and the move has the biting flag, apply 1.3x (model on Strong Jaw). After-hit: on a damaging biting move, roll 30% to frostbite the target if it can be frostbitten, and independently roll a flat 30% to flinch it."
