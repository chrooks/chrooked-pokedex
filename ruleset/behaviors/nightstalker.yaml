# Behavior spec — human-owned. The seed never touches this folder.
name: Night Stalker
chrooked_id: nightstalker
applies_to: ability
aka: {  }
effects:
  - summary: "In darkness, the holder's stronger attacking stat hits 1.3x harder."
    trigger: damage-calc
    when: "it is night (or a dark field), and the move's category matches the holder's higher attacking stat (Attack vs Sp. Atk, raw stat before stages)"
    effect: "multiply the damage by 1.3; a move of the other category gets nothing"
  - summary: "In darkness, the critical-hit ratio is one stage higher."
    trigger: damage-calc
    when: "it is night (or a dark field)"
    effect: "+1 crit stage (1 in 8 from base), additive with Scope Lens, Super Luck, Focus Energy; Shell Armor / Battle Armor / Lucky Chant still deny the crit"
test_cases:
  - given: "Crobat (Atk > SpA) uses Cross Poison at night"
    expect: "1.3x damage and a 1-in-8 crit roll"
  - given: "Crobat uses Air Cutter (special) at night"
    expect: "no 1.3x; the crit stage is still +1"
  - given: "Noctowl (SpA > Atk) uses Air Slash by day, no item"
    expect: "normal damage, base crit rate — the ability does nothing in light"
  - given: "any holder at night into Shell Armor"
    expect: "1.3x applies; no crit"
notes:
  - "Redesigned 2026-10-09. The old version forced a crit in darkness and gave +1 in light; with night plus nine dark fields (every cave) that was 'always crit' for half the game. Chris: 'too OP'. Now a flat 1.3x (Tough Claws / Sheer Force range) plus a 1-in-8 crit stage, darkness only."
  - "Darkness is the night clock; Rejuv extends it to the Dusk Ball dark fields, as before."
  - "'Stronger attacking stat' is read from the raw stat, not the staged one, so a Swords Dance does not flip which category the bonus serves."
engine_hints:
  essentials: "Rejuv: CHROOKED_DAMAGE_MODS[:NIGHTSTALKER] returns 1.3 when ChrookedNightStalker.dark?(battle) and the move category matches attacker.attack >= attacker.spatk; the existing CritStage prepend now adds +1 only when dark. CHROOKED_CRIT_RATE entry removed."
  pokeemerald: "Damage: in the attacker-ability switch of CalcDamage/ApplyModifier (same site as ABILITY_TOUGH_CLAWS), if night and category matches max(baseAttack, baseSpAttack) → UQ_4_12(1.3). Crit: in CalcCritChance's ability switch, +1 when night."
