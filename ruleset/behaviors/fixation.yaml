# Behavior spec — human-owned. The seed never touches this folder.
name: Fixation
chrooked_id: fixation
applies_to: ability
aka: { pokeemerald: ABILITY_FIXATION }
effects:
  - summary: The user's special moves deal 1.5x damage.
    trigger: damage-calc
    when: the move being used is a special move (and the user is not Dynamaxed)
    effect: multiply the damage modifier by 1.5
  - summary: After its first move, the user is locked into that move until it switches out.
    trigger: turn-order
    when: the user has already chosen a move since being sent out and tries to select a different one
    effect: disallow selecting any move other than the first one chosen; only that move remains usable
test_cases:
  - given: a Sage Power user uses a special move
    expect: that move deals 1.5x its normal damage
  - given: a Sage Power user uses a physical move
    expect: no 1.5x boost applies (boost is special-only)
  - given: a Sage Power user uses Flamethrower, then on a later turn tries to select Psychic
    expect: Psychic is locked out; the user is forced to use Flamethrower until it switches out
notes:
  - This is the special-move counterpart of Compulsion / Gorilla Tactics (physical-only x1.5 + move lock); it reuses the same lock code path.
  - The move lock resets when the Pokemon switches out and back in.
  - The x1.5 damage boost does not apply while Dynamaxed.
  - The lock applies regardless of whether the user holds a Choice item; the lock is driven by the same gBattleStruct choicedMove slot.
  - "Renamed from Sage Power 2026-09-08: the old name read as a special Pure Power. Sibling of Compulsion (physical)."
engine_hints:
  pokeemerald: "Damage: src/battle_util.c case ABILITY_FIXATION (ref ~7342) — IsBattleMoveSpecial -> uq4_12_multiply(modifier, UQ_4_12(1.5)). Lock: src/battle_util.c ~1603 and ~1713 treat ABILITY_FIXATION like ABILITY_GORILLA_TACTICS in the move-limitation check; also src/battle_move_resolution.c ~490 and ~3068."
  essentials: Combine Gorilla Tactics' move-lock (OnStartChoosingTargets / pbChooseMoves restriction) with a special-move damage multiplier of 1.5x in pbCalcDamageMultipliers.
