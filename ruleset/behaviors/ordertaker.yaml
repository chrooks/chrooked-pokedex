# Behavior spec — human-owned. The seed never touches this folder.
name: Order Taker
chrooked_id: ordertaker
applies_to: ability
aka: {  }
effects:
  - summary: On entry, all five battle stats rise if a Tatsugiri waits in the holder's party.
    trigger: switch-in
    when: "the holder's own trainer's party holds at least one non-fainted, non-egg Tatsugiri (any form: Curly, Droopy, Stretchy) other than the holder itself"
    effect: Raise the holder's Attack, Defense, Sp. Atk, Sp. Def and Speed by 1 stage each. Show the ability box and "{holder} is taking orders from {Tatsugiri}!", then the stat-up messages. If the condition fails, or no stat can rise, nothing happens and no ability box shows. Contrary, Simple and the +6 cap behave as for any self-boost. The battle-start lead counts as a switch-in.
test_cases:
  - given: Dondozo with Order Taker leads; a healthy Tatsugiri is in the back.
    expect: Ability box and message; Attack, Defense, Sp. Atk, Sp. Def and Speed each +1.
  - given: Dondozo switches in; the party's only Tatsugiri has fainted.
    expect: Nothing happens. No ability box.
  - given: Dondozo switches in with no Tatsugiri in the party.
    expect: Nothing happens.
  - given: "Multi battle: only the ally trainer's party has a Tatsugiri."
    expect: Nothing happens. Only the holder's own party counts.
  - given: Dondozo is already at +6 in all five stats (for example, via Baton Pass) and re-enters.
    expect: No ability box, no message.
  - given: A trainer's AI weighs switching in its Order Taker Dondozo with a Tatsugiri in its party.
    expect: The switch-in scorer models the +1s, as it does for Intrepid Sword.
notes:
  - "Chris, 2026-09-25: approved for the Dondozo blind design. The singles translation of Commander: the partner directs from the team."
  - Party means the holder's own trainer's party (Rejuv pbPartySingleOwner), not the whole side (pbParty), so a multi-battle ally trainer's Tatsugiri does not count. A Tatsugiri also on the field in a double battle still counts.
  - "The raise is vanilla Commander's own call, pbChangeStats(PBStats::Omni, 1, holder, nil, abilitycheck: :hide), so Contrary inverts it, Simple doubles it and the +6 cap holds."
  - "Like any vanilla entry ability, it also fires on the vanilla re-activations of pbAbilitiesOnSwitchIn: gaining the ability by Skill Swap, Trace, Transform or a boss ability change. The holder's own party is checked each time."
  - "AI: the plugin prepends PokeBattle_AI#pbStatChangingSwitch so a switch-in candidate with Order Taker and a living Tatsugiri in its party is scored with +1 in all five stats. Once on the field, the AI reads the real stat stages. The AI does NOT: model the boost on the post-Mega re-run of the scorer (skipped so a form change cannot double it); combine it with Contrary or Simple on a multi-ability set; value keeping Tatsugiri alive or in the back to preserve the boost; or predict the boost on the player's Order Taker switch-ins (pbStatChangingSwitchOpponent is untouched)."
engine_hints:
  essentials: "Rejuv: references/rejuv-harness/chrooked_ordertaker.rb. CHROOKED_SWITCH_IN[:ORDERTAKER]; party via @battle.pbPartySingleOwner(index) (Battle.rb:1092), self excluded by pokemonIndex; living = hp > 0 && !isEgg? (pbFindNextUnfainted, Battle.rb:1040); raise via pbCanIncreaseAnyStat?(PBStats::Omni, ...) + pbChangeStats(PBStats::Omni, 1, self, nil, abilitycheck: :hide) as vanilla Commander (Battler.rb:2740). AI: prepend PokeBattle_AI#pbStatChangingSwitch (Battle_AI.rb:12856). Stub check: references/rejuv-harness/ordertaker_check.rb."
