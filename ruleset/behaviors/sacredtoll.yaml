# Behavior spec — human-owned. The seed never touches this folder.
# Grounded in Dreamstone (dreamstone-mysteries, 1.11.2) C. Do not guess; the C is cited in engine_hints.
name: Sacred Toll
chrooked_id: sacredtoll
applies_to: ability
aka: { pokeemerald: ABILITY_SACRED_TOLL }
effects:
  - summary: "This Pokemon's sound moves become Psychic-type and gain a 20% damage boost."
    trigger: damage-calc
    when: "this Pokemon uses a sound move"
    effect: "treat the sound move as Psychic-type, then multiply its damage by 1.2"
test_cases:
  - given: "a Sacred Toll Pokemon uses a sound move (e.g. Hyper Voice)"
    expect: "the move is Psychic-type and deals ~20% more damage"
  - given: "a Sacred Toll Pokemon uses a non-sound move"
    expect: "no type change and no 1.2x boost"
  - given: "a Sacred Toll Pokemon uses a sound move into a Dark-type target"
    expect: "the Psychic-typed sound move follows normal Psychic effectiveness (0x vs Dark)"
notes:
  - "FLAG — feature genuinely absent in Dreamstone: the in-game data description says 'Cures team on entry.\\nSound to Psychic +20%', but Dreamstone's C does NOT implement any team-cure switch-in effect. There is no ABILITY_SACRED_TOLL case in the ABILITYEFFECT_ON_SWITCHIN handler (src/battle_util.c:4765+), and an exhaustive search of src/, data/, include/, and asm/ found SACRED_TOLL referenced only in the type-conversion and damage-boost paths. The team cure exists only as description text in this seed source. Do NOT implement the team cure unless the fork's C is changed to add it."
  - "The +20% boost is gated on the 'ateBoost' flag that the sound→Psychic conversion sets, so it applies exactly to converted sound moves (parallel to Liquid Voice's Water conversion and the -ize ability family)."
engine_hints:
  pokeemerald: "Type conversion: src/battle_main.c:6172 — IsSoundMove(move) && ability == ABILITY_SACRED_TOLL returns TYPE_PSYCHIC and sets ateBoost[battler]. Damage boost: src/battle_util.c:9646-9648 — UQ_4_12(1.2) when moveType == TYPE_PSYCHIC && gBattleStruct->ateBoost[battlerAtk]. NO switch-in / team-cure case exists anywhere in the C (verified against src/battle_util.c:4765+ switch-in handler and a full-tree grep)."
  essentials: "Convert sound moves to Psychic for this user and add a 1.2x damage modifier. Do NOT add team-cure-on-entry — it is not implemented in the seed source C, only in description text."
