# Behavior spec — human-owned. The seed never touches this folder.
# This describes HOW the mechanic works, engine-neutrally, so an implementer (Claude)
# can compile it into any target engine. The data layer carries the ability itself.
name: Striker
chrooked_id: striker
applies_to: ability
aka: { pokeemerald: ABILITY_STRIKER }
effects:
  - summary: "Kicking moves deal 30% more damage."
    trigger: damage-calc
    when: "this Pokemon uses a move flagged as a kicking move"
    effect: "multiply the move's damage by 1.3"
test_cases:
  - given: "Striker user uses High Jump Kick (a kicking move)"
    expect: "damage is multiplied by 1.3"
  - given: "Striker user uses Tackle (not a kicking move)"
    expect: "no boost; normal damage applies"
  - given: "a Pokemon without Striker uses High Jump Kick"
    expect: "no boost; normal damage applies"
notes:
  - "Keys off the per-move kickingMove flag, not the move's type."
engine_hints:
  pokeemerald: "src/battle_util.c attacker-ability damage modifier switch (~line 6949): case ABILITY_STRIKER gates on IsKickingMove(move) → UQ_4_12(1.3). Flag = gMovesInfo[].kickingMove (custom flag, include/move.h:136)."
  essentials: "Battle::Move damage-calc hook — if user ability is Striker and move has the kicking flag, apply a 1.3x multiplier."
