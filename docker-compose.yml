# Always-on Ruleset editor + applier for hestia. Serves the dex + edit UI on
# :8000. Since couch loop v2 (mjolnir CL-1), hestia also owns Apply and the
# patch mirror to the Thor: a staging game copy is bind-mounted at the same
# absolute path targets.json names, and /root/.ssh carries the key the Thor
# accepts. See scripts/ruleset-autocommit.sh for the edit-push loop.
services:
  web:
    build: .
    image: chrooked-pokedex
    container_name: chrooked-pokedex
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Save-state row (#88): Syncthing REST + conflict glob. Key in .env.
      - SYNCTHING_API_KEY=${SYNCTHING_API_KEY}
      - SYNCTHING_URL=http://host.docker.internal:8384
      - SYNCTHING_DEVICES=${SYNCTHING_DEVICES}
      - SAVES_DIR=/data/rejuv-saves
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # ruleset/ lives on the host so the host-side autocommit loop sees edits
      # the web app writes, and can commit + push them to the remote.
      - ./ruleset:/app/ruleset
      # Couch loop v2: staging game copy (apply target), mounted at the same
      # path inside and out so targets.json needs one truth. Machine-specific
      # rows live in targets.json (gitignored).
      - /home/chrooks/projects/rejuv-game:/home/chrooks/projects/rejuv-game
      - ./targets.json:/app/targets.json
      # Key + known_hosts + config the in-process mirror uses to reach the Thor.
      - /home/chrooks/projects/rejuv-ssh:/root/.ssh:ro
      # Save-state row: conflict-file glob source, read-only.
      - /srv/compose/syncthing/data/rejuv-saves:/data/rejuv-saves:ro
